<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Finova - Control Financiero & Negocios</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finova" />
    <meta name="description" content="Plataforma inteligente para control de ventas, inventario, balances y finanzas comerciales." />
    <meta property="og:title" content="Finova - Control Financiero & Negocios" />
    <meta property="og:description" content="Plataforma inteligente para control de ventas, inventario, balances y finanzas comerciales." />
    <script>
      (function() {
        // 1. Mock WebSocket for Vite HMR to prevent 'WebSocket closed without opened' errors in AI Studio iframe
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes(':24678') || url.includes('/@vite/')))) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1; // OPEN
              target.url = url;
              target.protocol = protocols || '';
              target.send = function() {};
              target.close = function() {
                target.readyState = 3;
              };
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 10);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Filter out Vite WebSocket connection warnings from console
        var origConsoleError = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(String).join(' ');
          if (msg.includes('WebSocket') || msg.includes('[vite] failed to connect') || msg.includes('vite:ws')) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // 3. Catch any unhandled errors or rejections from @vite/client
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.includes('WebSocket') || e.filename?.includes('@vite/client'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason?.stack).includes('@vite/client'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
